<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presidentes | SGT</title><style>body{font:16px system-ui;background:#f3f6fa;color:#19314a;margin:0}header{background:#123c62;color:white;padding:22px}main{max-width:760px;margin:30px auto;background:white;border-radius:12px;padding:25px;box-shadow:0 5px 25px #0001}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #b8c7d6;border-radius:7px;font:inherit}button{background:#165a87;color:white;cursor:pointer}a{color:#165a87}nav a{margin-right:18px;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf3f7;padding:12px}label{display:block;margin-top:10px}small{color:#596b7b}</style><header><h2>Sistema de Gestión Territorial</h2><nav><a href="vecinos.html">Vecinos</a><a href="presidentes.html">Presidentes</a><a href="seguimiento.html">Seguimiento</a></nav></header><main><h1>Portal de presidentes</h1><p>Acceso exclusivo para presidentes autorizados.</p><div id="login"><input id="u" placeholder="Usuario"><input id="p" type="password" placeholder="Contraseña"><button id="enter">Ingresar</button></div><div id="panel" hidden><button id="refresh">Actualizar solicitudes</button><button id="exit">Cerrar sesión</button><div id="list"></div></div><pre id="out"></pre><script src="../assets/js/portal-demo.js"></script><script>async function api(url,body,token){let r=await fetch(url,{method:body?'POST':'GET',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(x.error||'Error');return x}function msg(id,t){document.getElementById(id).textContent=t}function val(id){return document.getElementById(id).value};let token='';async function load(){let x=await api('/api/presidente/solicitudes',null,token);let el=document.getElementById('list');el.replaceChildren();for(let s of x.solicitudes){let d=document.createElement('section');let h=document.createElement('h3');h.textContent=s.codigo+' — '+s.nombre;d.append(h);let p=document.createElement('p');p.textContent=s.requerimiento+' | '+s.direccion+' | '+s.estado;d.append(p);if(s.estado==='pendiente_presidente'){for(let st of ['aceptada_presidente','rechazada_presidente']){let b=document.createElement('button');b.textContent=st==='aceptada_presidente'?'Aceptar':'Rechazar';b.onclick=async()=>{let motivo=st==='rechazada_presidente'?prompt('Motivo del rechazo:')||'Sin detalle':'';try{await api('/api/presidente/decision',{codigo:s.codigo,estado:st,motivo},token);await load()}catch(e){msg('out',e.message)}};d.append(b)}}el.append(d)}}document.getElementById('enter').onclick=async()=>{try{let x=await api('/api/presidente/login',{usuario:val('u'),password:val('p')});token=x.token;document.getElementById('login').hidden=true;document.getElementById('panel').hidden=false;await load()}catch(e){msg('out',e.message)}};document.getElementById('refresh').onclick=()=>load().catch(e=>msg('out',e.message));document.getElementById('exit').onclick=()=>{token='';document.getElementById('panel').hidden=true;document.getElementById('login').hidden=false};</script></main></html>
