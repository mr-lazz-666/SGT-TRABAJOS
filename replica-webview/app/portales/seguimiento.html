<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento | SGT</title><style>body{font:16px system-ui;background:#f3f6fa;color:#19314a;margin:0}header{background:#123c62;color:white;padding:22px}main{max-width:760px;margin:30px auto;background:white;border-radius:12px;padding:25px;box-shadow:0 5px 25px #0001}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #b8c7d6;border-radius:7px;font:inherit}button{background:#165a87;color:white;cursor:pointer}a{color:#165a87}nav a{margin-right:18px;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf3f7;padding:12px}label{display:block;margin-top:10px}small{color:#596b7b}</style><header><h2>Sistema de Gestión Territorial</h2><nav><a href="vecinos.html">Vecinos</a><a href="presidentes.html">Presidentes</a><a href="seguimiento.html">Seguimiento</a></nav></header><main><h1>Consultar solicitud</h1><p>Ingresa el código de seguimiento recibido.</p><input id="code" placeholder="SGT-XXXXXXXX-XXXX"><button id="b">Consultar</button><pre id="out"></pre><script src="../assets/js/portal-demo.js"></script><script>async function api(url,body,token){let r=await fetch(url,{method:body?'POST':'GET',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(x.error||'Error');return x}function msg(id,t){document.getElementById(id).textContent=t}function val(id){return document.getElementById(id).value};document.getElementById('b').onclick=async()=>{try{let x=await api('/api/seguimiento/'+encodeURIComponent(val('code').trim()));msg('out','Código: '+x.codigo+'\nEstado: '+x.estado+'\nActualizado: '+x.actualizada+'\nHistorial:\n'+x.eventos.map(e=>e.fecha+' — '+e.estado).join('\n'))}catch(e){msg('out',e.message)}};</script></main></html>
